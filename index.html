<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>loading</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #dfe5e9;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading {
      color: #748186;
      font-family: "Courier New", monospace;
      font-size: 2rem;
      letter-spacing: 0.2em;

      animation: fade 2s ease-in-out infinite;
    }

    @keyframes fade {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="loading">loading</div>
</body>
</html>
